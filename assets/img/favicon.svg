<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Mosaico / Icono estilo Windows Metro para Christian Chancay -->
  <rect width="64" height="64" rx="12" fill="#0078d4"/>
  <rect x="2" y="2" width="60" height="60" rx="10" fill="none" stroke="rgba(255, 255, 255, 0.25)" stroke-width="2"/>
  
  <!-- Texto centrado {CC} -->
  <text x="32" y="43" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="27" font-weight="800" text-anchor="middle" letter-spacing="-0.5">
