<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="suit-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="tie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  
  <!-- Fondo circular con borde elegante -->
  <circle cx="200" cy="200" r="195" fill="url(#bg-grad)" stroke="#3b82f6" stroke-width="4"/>
  <circle cx="200" cy="200" r="170" fill="none" stroke="rgba(59, 130, 246, 0.2)" stroke-width="1.5" stroke-dasharray="5,5"/>

  <!-- Traje profesional (Saco oscuro) -->
  <path d="M 95 360 L 120 270 L 165 240 L 200 290 L 235 240 L 280 270 L 305 360 Z" fill="url(#suit-grad)" stroke="#334155" stroke-width="2"/>
  <path d="M 95 360 C 95 275, 130 250, 165 240 L 180 360 Z" fill="#0f172a"/>
  <path d="M 305 360 C 305 275, 270 250, 235 240 L 220 360 Z" fill="#0f172a"/>
  
  <!-- Camisa celeste formal -->
  <polygon points="165,240 200,290 235,240 220,205 180,205" fill="#bae6fd"/>
  
  <!-- Cuello y corbata azul -->
  <polygon points="180,205 200,240 185,240" fill="#93c5fd"/>
  <polygon points="220,205 200,240 215,240" fill="#93c5fd"/>
  <!-- Nudo de la corbata -->
  <polygon points="193,235 207,235 204,248 196,248" fill="#1e40af"/>
  <!-- Cuerpo de la corbata -->
  <polygon points="196,248 204,248 208,340 200,355 192,340" fill="url(#tie-grad)"/>

  <!-- Cuello -->
  <rect x="182" y="190" width="36" height="35" rx="4" fill="#fbd5bb"/>
  
  <!-- Rostro -->
  <ellipse cx="200" cy="155" rx="50" ry="58" fill="#fbd5bb"/>
  <ellipse cx="150" cy="155" rx="7" ry="14" fill="#fbd5bb"/>
  <ellipse cx="250" cy="155" rx="7" ry="14" fill="#fbd5bb"/>
  
  <!-- Ojos y cejas -->
  <ellipse cx="182" cy="150" rx="4" ry="3" fill="#1e293b"/>
  <ellipse cx="218" cy="150" rx="4" ry="3" fill="#1e293b"/>
  <path d="M 174 142 Q 182 138 190 142" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <path d="M 210 142 Q 218 138 226 142" stroke="#1e293b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  
  <!-- Nariz y boca amable -->
  <path d="M 198 152 L 196 166 L 204 166" stroke="#d97706" stroke-width="1.8" fill="none" stroke-linecap="round"/>
  <path d="M 188 178 Q 200 186 212 178" stroke="#b45309" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cabello oscuro bien peinado hacia arriba (estilo formal del CV) -->
  <path d="M 150 145 C 145 110, 160 85, 200 80 C 240 85, 255 110, 250 145 C 242 120, 230 110, 200 110 C 170 110, 158 120, 150 145 Z" fill="#171717"/>
  <path d="M 170 88 Q 200 75 230 88" stroke="#262626" stroke-width="5" fill="none"/>

  <!-- Insignia flotante TI / Soporte -->
  <g transform="translate(295, 75)">
    <circle cx="26" cy="26" r="26" fill="#1e293b" stroke="#3b82f6" stroke-width="2"/>
    <text x="26" y="32" fill="#38bdf8" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">TI</text>
  </g>
  
  <!-- Insignia flotante Desarrollo de Software -->
  <g transform="translate(45, 250)">
    <circle cx="24" cy="24" r="24" fill="#1e293b" stroke="#10b981" stroke-width="2"/>
    <text x="24" y="30" fill="#4ade80" font-family="monospace" font-size="14" font-weight="bold" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
