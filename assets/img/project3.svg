<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="360" fill="url(#bg3)"/>
  
  <!-- Browser window chrome -->
  <rect x="30" y="25" width="540" height="310" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="25" width="540" height="36" rx="10" fill="#0f172a"/>
  <!-- Window buttons -->
  <circle cx="55" cy="43" r="5" fill="#ef4444"/>
  <circle cx="72" cy="43" r="5" fill="#f59e0b"/>
  <circle cx="89" cy="43" r="5" fill="#10b981"/>
  <rect x="120" y="34" width="280" height="18" rx="4" fill="#1e293b"/>
  <text x="135" y="47" fill="#64748b" font-family="sans-serif" font-size="10">https://weather-analytics.io</text>

  <!-- Left: Weather Widget -->
  <rect x="50" y="80" width="180" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="110" fill="#f8fafc" font-family="sans-serif" font-size="16" font-weight="bold">Ciudad de México</text>
  <text x="70" y="128" fill="#94a3b8" font-family="sans-serif" font-size="11">Parcialmente nublado</text>
  
  <!-- Sun & cloud icon -->
  <circle cx="100" cy="170" r="24" fill="#fbbf24"/>
  <path d="M 90 185 C 90 170, 115 170, 125 180 C 135 170, 155 175, 155 188 C 165 190, 165 202, 150 205 L 90 205 Z" fill="#94a3b8" opacity="0.85"/>
  
  <text x="140" y="165" fill="#38bdf8" font-family="sans-serif" font-size="28" font-weight="bold">24°C</text>
  <rect x="70" y="235" width="140" height="1" fill="#334155"/>
  <text x="70" y="260" fill="#94a3b8" font-family="sans-serif" font-size="10">Viento: 14 km/h</text>
  <text x="70" y="280" fill="#94a3b8" font-family="sans-serif" font-size="10">Humedad: 58%</text>

  <!-- Right: Chart / Forecast Analytics -->
  <rect x="250" y="80" width="300" height="230" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="270" y="110" fill="#f8fafc" font-family="sans-serif" font-size="14" font-weight="bold">Pronóstico Semanal y Temperatura</text>
  
  <!-- Chart area -->
  <path d="M 280 230 Q 330 150 370 180 T 450 140 T 520 170 L 520 260 L 280 260 Z" fill="url(#chartGrad)"/>
  <path d="M 280 230 Q 330 150 370 180 T 450 140 T 520 170" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <circle cx="330" cy="150" r="4" fill="#38bdf8"/>
  <circle cx="370" cy="180" r="4" fill="#38bdf8"/>
  <circle cx="450" cy="140" r="4" fill="#38bdf8"/>
  <circle cx="520" cy="170" r="4" fill="#38bdf8"/>

  <text x="280" y="280" fill="#64748b" font-family="sans-serif" font-size="10">LUN</text>
  <text x="330" y="280" fill="#64748b" font-family="sans-serif" font-size="10">MAR</text>
  <text x="380" y="280" fill="#64748b" font-family="sans-serif" font-size="10">MIÉ</text>
  <text x="430" y="280" fill="#64748b" font-family="sans-serif" font-size="10">JUE</text>
  <text x="480" y="280" fill="#64748b" font-family="sans-serif" font-size="10">VIE</text>
</svg>
