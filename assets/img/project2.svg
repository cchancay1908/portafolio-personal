<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
  </defs>

  <!-- Fondo de la ventana -->
  <rect width="600" height="360" fill="#0f172a" rx="8"/>
  
  <!-- Barra superior estilo Panel de Seguridad de Windows -->
  <rect x="0" y="0" width="600" height="42" fill="url(#headerGrad2)" rx="8"/>
  <rect x="0" y="30" width="600" height="12" fill="url(#headerGrad2)"/>
  
  <!-- Título -->
  <text x="24" y="26" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700">Seguridad de la Información | Cifrado de Unidades &amp; Gestión de Activos</text>
  <rect x="460" y="11" width="120" height="20" rx="3" fill="rgba(255,255,255,0.18)"/>
  <text x="520" y="25" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">BitLocker: Activado</text>

  <!-- Panel Izquierdo: Cifrado de Discos (BitLocker) -->
  <rect x="24" y="58" width="280" height="278" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="25" y="59" width="278" height="32" fill="#0f172a" rx="3"/>
  <text x="40" y="80" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Cifrado de Unidad BitLocker</text>

  <!-- Unidad C: -->
  <rect x="38" y="102" width="252" height="66" rx="4" fill="#0f172a" stroke="#0078d4" stroke-width="1.5"/>
  <text x="52" y="123" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Disco Local (C:) - Sistema Operativo</text>
  <text x="52" y="141" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Cifrado AES-256 | TPM 2.0 Habilitado</text>
  <rect x="52" y="148" width="160" height="6" rx="3" fill="#334155"/>
  <rect x="52" y="148" width="160" height="6" rx="3" fill="#10b981"/>
  <text x="220" y="155" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">100% Cifrado</text>

  <!-- Unidad D: -->
  <rect x="38" y="178" width="252" height="66" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="52" y="199" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Almacenamiento Datos (D:)</text>
  <text x="52" y="217" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Protección de Datos Confidenciales</text>
  <rect x="52" y="224" width="160" height="6" rx="3" fill="#334155"/>
  <rect x="52" y="224" width="160" height="6" rx="3" fill="#0078d4"/>
  <text x="220" y="231" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">Protegido</text>

  <!-- Resumen de Política de Seguridad -->
  <rect x="38" y="254" width="252" height="68" rx="4" fill="rgba(0,120,212,0.12)" stroke="#0078d4" stroke-width="1"/>
  <text x="52" y="274" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">POLÍTICA DE CUMPLIMIENTO TI</text>
  <text x="52" y="292" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Clave de recuperación respaldada en AD</text>
  <text x="52" y="308" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Directiva corporativa Conecel S.A. OK</text>

  <!-- Panel Derecho: Inventario de Activos y Destrucción Segura -->
  <rect x="316" y="58" width="260" height="278" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="317" y="59" width="258" height="32" fill="#0f172a" rx="3"/>
  <text x="332" y="80" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="700">Gestión de Activos &amp; Baja Segura</text>

  <!-- Control de Inventario -->
  <text x="332" y="112" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">ESTADO DEL INVENTARIO DE HARDWARE</text>
  
  <rect x="332" y="122" width="228" height="30" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="344" y="141" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11">Equipos asignados en inventario</text>
  <text x="536" y="141" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="end">412</text>

  <rect x="332" y="158" width="228" height="30" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="344" y="177" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11">Medios con cifrado verificado</text>
  <text x="536" y="177" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700" text-anchor="end">100%</text>

  <!-- Destrucción Segura y Baja Tecnológica -->
  <text x="332" y="210" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">BAJA TECNOLÓGICA &amp; SANITIZACIÓN</text>

  <rect x="332" y="220" width="228" height="102" rx="3" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <text x="344" y="240" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">[OK] Desmagnetización de discos (Degauss)</text>
  <text x="344" y="260" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">[OK] Sobreescritura segura (DoD 5220.22-M)</text>
  <text x="344" y="280" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="700">[OK] Acta de destrucción física de medios</text>
  <text x="344" y="304" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10">Custodia final y reporte técnico emitido</text>
</svg>
