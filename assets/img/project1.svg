<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="headerGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0078d4"/>
      <stop offset="100%" stop-color="#005a9e"/>
    </linearGradient>
  </defs>

  <!-- Fondo de la ventana -->
  <rect width="600" height="360" fill="#0f172a" rx="8"/>
  
  <!-- Barra superior de la aplicación Service Desk -->
  <rect x="0" y="0" width="600" height="42" fill="url(#headerGrad1)" rx="8"/>
  <rect x="0" y="30" width="600" height="12" fill="url(#headerGrad1)"/>
  
  <!-- Título de la aplicación -->
  <text x="24" y="26" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="13" font-weight="700">Mesa de Servicios | Service Desk Conecel S.A.</text>
  <rect x="475" y="11" width="105" height="20" rx="3" fill="rgba(255,255,255,0.18)"/>
  <text x="527" y="25" fill="#ffffff" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SLA: 98.4% Cumplido</text>

  <!-- Tarjetas de métricas superiores -->
  <!-- Métrica 1 -->
  <rect x="24" y="58" width="165" height="54" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="38" y="78" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">INCIDENTES ACTIVOS</text>
  <text x="38" y="102" fill="#38bdf8" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700">18</text>
  <text x="75" y="100" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Soporte N1</text>

  <!-- Métrica 2 -->
  <rect x="205" y="58" width="185" height="54" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="219" y="78" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">TIEMPO PROMEDIO ATENCIÓN</text>
  <text x="219" y="102" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700">14 min</text>
  <text x="315" y="100" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">&lt; SLA 30m</text>

  <!-- Métrica 3 -->
  <rect x="406" y="58" width="170" height="54" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="420" y="78" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600">RESOLUCIÓN DE TICKETS</text>
  <text x="420" y="102" fill="#10b981" font-family="'Segoe UI', sans-serif" font-size="20" font-weight="700">324</text>
  <text x="468" y="100" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600">Este mes</text>

  <!-- Tabla de Tickets de Service Desk -->
  <rect x="24" y="126" width="552" height="210" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  
  <!-- Encabezado de tabla -->
  <rect x="25" y="127" width="550" height="28" fill="#0f172a" rx="3"/>
  <text x="40" y="145" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">ID TICKET</text>
  <text x="125" y="145" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">DESCRIPCIÓN DEL INCIDENTE</text>
  <text x="345" y="145" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">CATEGORÍA</text>
  <text x="445" y="145" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">PRIORIDAD</text>
  <text x="518" y="145" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="700">ESTADO</text>

  <!-- Fila 1 -->
  <line x1="25" y1="195" x2="575" y2="195" stroke="#334155" stroke-width="1"/>
  <text x="40" y="177" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">INC-8492</text>
  <text x="125" y="177" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11">Falla conectividad red y dominio Windows</text>
  <text x="345" y="177" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Redes / SO</text>
  <rect x="445" y="165" width="45" height="18" rx="2" fill="rgba(239, 68, 68, 0.2)" stroke="#ef4444" stroke-width="1"/>
  <text x="467" y="178" fill="#f87171" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ALTA</text>
  <rect x="510" y="165" width="56" height="18" rx="2" fill="rgba(0, 120, 212, 0.25)" stroke="#0078d4" stroke-width="1"/>
  <text x="538" y="178" fill="#60a5fa" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">EN CURSO</text>

  <!-- Fila 2 -->
  <line x1="25" y1="240" x2="575" y2="240" stroke="#334155" stroke-width="1"/>
  <text x="40" y="222" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">REQ-6120</text>
  <text x="125" y="222" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11">Configuración equipo y periféricos usuario</text>
  <text x="345" y="222" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Hardware</text>
  <rect x="445" y="210" width="45" height="18" rx="2" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
  <text x="467" y="223" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MEDIA</text>
  <rect x="510" y="210" width="56" height="18" rx="2" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
  <text x="538" y="223" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">ATENDIDO</text>

  <!-- Fila 3 -->
  <line x1="25" y1="285" x2="575" y2="285" stroke="#334155" stroke-width="1"/>
  <text x="40" y="267" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">INC-8488</text>
  <text x="125" y="267" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11">Mantenimiento preventivo impresora láser</text>
  <text x="345" y="267" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Periféricos</text>
  <rect x="445" y="255" width="45" height="18" rx="2" fill="rgba(59, 130, 246, 0.2)" stroke="#3b82f6" stroke-width="1"/>
  <text x="467" y="268" fill="#93c5fd" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">BAJA</text>
  <rect x="510" y="255" width="56" height="18" rx="2" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
  <text x="538" y="268" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">CERRADO</text>

  <!-- Fila 4 -->
  <text x="40" y="312" fill="#38bdf8" font-family="'Segoe UI', monospace" font-size="11" font-weight="700">REQ-6115</text>
  <text x="125" y="312" fill="#f8fafc" font-family="'Segoe UI', sans-serif" font-size="11">Soporte remoto estación de trabajo ejecutiva</text>
  <text x="345" y="312" fill="#cbd5e1" font-family="'Segoe UI', sans-serif" font-size="10">Remoto N1</text>
  <rect x="445" y="300" width="45" height="18" rx="2" fill="rgba(245, 158, 11, 0.2)" stroke="#f59e0b" stroke-width="1"/>
  <text x="467" y="313" fill="#fbbf24" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">MEDIA</text>
  <rect x="510" y="300" width="56" height="18" rx="2" fill="rgba(16, 185, 129, 0.2)" stroke="#10b981" stroke-width="1"/>
  <text x="538" y="313" fill="#34d399" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" text-anchor="middle">CERRADO</text>
</svg>
