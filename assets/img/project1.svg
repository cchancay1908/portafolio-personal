<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="btn1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="600" height="360" fill="url(#bg1)"/>
  
  <!-- Browser window chrome -->
  <rect x="30" y="25" width="540" height="310" rx="10" fill="#1e293b" stroke="#334155" stroke-width="2"/>
  <rect x="30" y="25" width="540" height="36" rx="10" fill="#0f172a"/>
  <!-- Window buttons -->
  <circle cx="55" cy="43" r="5" fill="#ef4444"/>
  <circle cx="72" cy="43" r="5" fill="#f59e0b"/>
  <circle cx="89" cy="43" r="5" fill="#10b981"/>
  <rect x="120" y="34" width="280" height="18" rx="4" fill="#1e293b"/>
  <text x="135" y="47" fill="#64748b" font-family="sans-serif" font-size="10">https://mitienda-tech.dev</text>

  <!-- Store header -->
  <rect x="50" y="80" width="120" height="16" rx="4" fill="#38bdf8"/>
  <rect x="450" y="78" width="100" height="22" rx="6" fill="#3b82f6"/>
  <text x="480" y="93" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">Carrito (3)</text>

  <!-- Product Grid -->
  <!-- Product 1 -->
  <rect x="50" y="120" width="150" height="185" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="65" y="135" width="120" height="80" rx="6" fill="#1e293b"/>
  <circle cx="125" cy="175" r="22" fill="#38bdf8" opacity="0.3"/>
  <text x="125" y="180" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">💻</text>
  <rect x="65" y="225" width="85" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="65" y="242" width="45" height="10" rx="3" fill="#38bdf8"/>
  <rect x="65" y="265" width="120" height="25" rx="5" fill="url(#btn1)"/>
  <text x="125" y="281" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Comprar</text>

  <!-- Product 2 -->
  <rect x="225" y="120" width="150" height="185" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="240" y="135" width="120" height="80" rx="6" fill="#1e293b"/>
  <circle cx="300" cy="175" r="22" fill="#818cf8" opacity="0.3"/>
  <text x="300" y="180" fill="#818cf8" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">🎧</text>
  <rect x="240" y="225" width="95" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="240" y="242" width="45" height="10" rx="3" fill="#818cf8"/>
  <rect x="240" y="265" width="120" height="25" rx="5" fill="url(#btn1)"/>
  <text x="300" y="281" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Comprar</text>

  <!-- Product 3 -->
  <rect x="400" y="120" width="150" height="185" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <rect x="415" y="135" width="120" height="80" rx="6" fill="#1e293b"/>
  <circle cx="475" cy="175" r="22" fill="#34d399" opacity="0.3"/>
  <text x="475" y="180" fill="#34d399" font-family="sans-serif" font-size="18" font-weight="bold" text-anchor="middle">⌚</text>
  <rect x="415" y="225" width="80" height="10" rx="3" fill="#e2e8f0"/>
  <rect x="415" y="242" width="45" height="10" rx="3" fill="#34d399"/>
  <rect x="415" y="265" width="120" height="25" rx="5" fill="url(#btn1)"/>
  <text x="475" y="281" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">Comprar</text>
</svg>
